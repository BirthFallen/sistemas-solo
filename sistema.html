<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solo Leveling</title>
    <style>
        /* Cores fiéis ao anime: Fundo escuro, azul neon e branco/cinza */
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(10, 15, 30, 0.85);
            --neon-blue: #00d2ff;
            --neon-glow: 0 0 15px rgba(0, 210, 255, 0.6);
            --text-main: #e0f7fa;
            --warning-red: #ff3333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #0a1128 0%, #000000 100%);
        }

        /* O Painel do Sistema adaptado para Mobile */
        .system-panel {
            background-color: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            border-radius: 8px;
            box-shadow: var(--neon-glow);
            width: 100%;
            max-width: 400px; /* Limita o tamanho em telas grandes */
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .header {
            color: var(--neon-blue);
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--neon-blue);
            padding-bottom: 10px;
        }

        .quest-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .quest-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            text-align: left;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid var(--neon-blue);
        }

        .quest-list li {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .streak-container {
            font-size: 1.2rem;
            margin: 20px 0;
            padding: 15px;
            border: 1px dashed var(--neon-blue);
            border-radius: 5px;
        }

        .streak-number {
            font-size: 2.5rem;
            color: var(--neon-blue);
            font-weight: bold;
            display: block;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Botão estilizado */
        button {
            background-color: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0, 210, 255, 0.3);
        }

        button:hover {
            background-color: var(--neon-blue);
            color: #000;
            box-shadow: var(--neon-glow);
        }

        button:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        .message {
            margin-top: 15px;
            font-size: 1rem;
            min-height: 24px;
        }
        
        .penalty {
            color: var(--warning-red);
            font-weight: bold;
            text-shadow: 0 0 5px red;
        }
    </style>
</head>
<body>

    <div class="system-panel">
        <div class="header">⚠ Alerta do Sistema ⚠</div>
        <div class="quest-title">Missão Diária: Preparação do Jogador</div>
        
        <ul class="quest-list">
            <li>[ ] Flexões: 100</li>
            <li>[ ] Abdominais: 100</li>
            <li>[ ] Agachamentos: 100</li>
            <li>[ ] Corrida: 10 km</li>
        </ul>

        <div class="streak-container">
            Dias Consecutivos: 
            <span class="streak-number" id="streak-display">0</span>
        </div>

        <button id="complete-btn" onclick="checkIn()">Completar Missão</button>
        <div class="message" id="system-msg"></div>
    </div>

    <script>
        // Lógica em JavaScript para gerenciar os dias consecultivos
        
        // Elementos da interface
        const streakDisplay = document.getElementById('streak-display');
        const systemMsg = document.getElementById('system-msg');
        const completeBtn = document.getElementById('complete-btn');

        // Carrega os dados salvos no navegador (se existirem)
        let streak = parseInt(localStorage.getItem('solo_streak')) || 0;
        let lastDate = localStorage.getItem('solo_last_date');

        // Atualiza a tela ao carregar
        streakDisplay.innerText = streak;
        checkDailyStatus();

        function checkDailyStatus() {
            if (!lastDate) return;

            const today = new Date().setHours(0,0,0,0);
            const last = new Date(lastDate).setHours(0,0,0,0);
            const diffTime = today - last;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 0) {
                systemMsg.innerText = "Missão de hoje já concluída. Descanse, Jogador.";
                completeBtn.innerText = "Missão Concluída";
                completeBtn.disabled = true;
            } else if (diffDays > 1) {
                // Penalidade! Passou mais de 1 dia sem treinar
                streak = 0;
                localStorage.setItem('solo_streak', streak);
                streakDisplay.innerText = streak;
                systemMsg.innerHTML = '<span class="penalty">Missão Falhou! Você foi enviado para a Zona de Penalidade. A sequência foi resetada.</span>';
            } else {
                systemMsg.innerText = "Uma nova missão diária está disponível.";
            }
        }

        function checkIn() {
            const todayStr = new Date().toISOString().split('T')[0]; // Pega a data YYYY-MM-DD
            
            streak++;
            localStorage.setItem('solo_streak', streak);
            localStorage.setItem('solo_last_date', todayStr);
            
            streakDisplay.innerText = streak;
            systemMsg.innerText = "Recompensas foram enviadas para o seu inventário.";
            completeBtn.innerText = "Missão Concluída";
            completeBtn.disabled = true;
        }
    </script>
</body>
</html>
